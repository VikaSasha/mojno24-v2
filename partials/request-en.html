<dialog class="modal" id="request-dialog" aria-labelledby="req-title">
  <button class="icon-btn modal__close" type="button" data-dialog-close aria-label="Close request form"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="modal__inner">
    <aside class="modal__aside">
      <p class="kicker">Sales team</p>
      <h2 class="modal__title" id="req-title">Let’s work together</h2>
      <p class="small">Add items from the catalogue or write without choosing products. We send prices and terms individually.</p>
      <div class="cluster" style="justify-content:space-between"><strong>Your list</strong><span class="count-badge has-items" data-request-total>0</span></div>
      <ul class="req-list" data-request-list aria-live="polite"></ul>
      <div class="cluster mt-0">
        <a class="btn btn--sm btn--light" href="catalog.html">Go to products</a>
        <button class="btn btn--sm btn--ghost" type="button" data-request-clear>Clear</button>
      </div>
    </aside>
    <div class="modal__main">
      <form data-mail-form data-with-list novalidate>
        <div class="form-grid">
          <fieldset class="radio-cards">
            <legend>You are <span class="req" aria-hidden="true">*</span></legend>
            <label class="radio-card"><input type="radio" name="who" value="importer" data-label="Importer / distributor" required><span>Importer or distributor</span></label>
            <label class="radio-card"><input type="radio" name="who" value="retail" data-label="Retail chain"><span>Retail chain</span></label>
            <label class="radio-card"><input type="radio" name="who" value="stm" data-label="Private label"><span>Private label</span></label>
            <label class="radio-card"><input type="radio" name="who" value="horeca" data-label="HoReCa"><span>HoReCa</span></label>
            <label class="radio-card"><input type="radio" name="who" value="other" data-label="Other"><span>Other</span></label>
            <span class="field__error" role="alert"></span>
          </fieldset>
          <div class="form-grid form-grid--2">
            <div class="field"><label for="rq-name">Name <span class="req" aria-hidden="true">*</span></label><input class="input" id="rq-name" name="name" autocomplete="name" required><span class="field__error" role="alert"></span></div>
            <div class="field"><label for="rq-company">Company</label><input class="input" id="rq-company" name="company" autocomplete="organization"></div>
            <div class="field"><label for="rq-contact">Phone or e-mail <span class="req" aria-hidden="true">*</span></label><input class="input" id="rq-contact" name="contact" autocomplete="email" required><span class="field__error" role="alert"></span></div>
            <div class="field"><label for="rq-city">Country</label><input class="input" id="rq-city" name="city" autocomplete="country-name"></div>
            <div class="field span-2"><label for="rq-msg">Comment</label><textarea class="textarea" id="rq-msg" name="message" rows="3" placeholder="Volumes, sales channels, required packs"></textarea></div>
          </div>
          <label class="check"><input type="checkbox" name="consent" required><span>I agree to the processing of my personal data under the <a href="../privacy.html" hreflang="ru">privacy policy</a> (in Russian).</span><span class="field__error" role="alert"></span></label>
          <div class="alert" data-form-status role="status" hidden></div>
          <div class="cluster">
            <button class="btn btn--lg" type="submit">Send request</button>
            <p class="form-note mb-0">Your e-mail app will open with a ready message to info@newprod.ru.</p>
          </div>
        </div>
      </form>
    </div>
  </div>
</dialog>
